# Validated against the current cargo-deny template on 2026-10-10.

[graph]
all-features = true
targets = [
  "aarch64-apple-darwin",
  "x86_64-apple-darwin",
  "x86_64-pc-windows-msvc",
  "x86_64-unknown-linux-gnu",
]

[advisories]
ignore = []

[licenses]
allow = [
  "Apache-2.0",
  "MIT",
  "Unicode-3.0",
]
confidence-threshold = 0.93
exceptions = [
  # PR-003: unmodified development-only prost-build -> petgraph -> hashbrown.
  # Exact Zlib license reviewed; preserve source notice, mark any alterations.
  { name = "foldhash", version = "=0.1.5", allow = ["Zlib"] },
  # NW-006: retain the published BSD and MIT notices for this exact RFC 6455 helper.
  { name = "sha1_smol", version = "=1.0.1", allow = ["BSD-3-Clause"] },
  # ADR 0006: unmodified Tauri dependencies. Include their notices and exact
  # covered-source locations with the Windows test executable.
  { name = "cssparser", version = "=0.37.0", allow = ["MPL-2.0"] },
  { name = "cssparser-macros", version = "=0.7.1", allow = ["MPL-2.0"] },
  { name = "dtoa-short", version = "=0.3.5", allow = ["MPL-2.0"] },
  { name = "foldhash", version = "=0.2.0", allow = ["Zlib"] },
  { name = "option-ext", version = "=0.2.0", allow = ["MPL-2.0"] },
  { name = "selectors", version = "=0.38.0", allow = ["MPL-2.0"] },
]

[licenses.private]
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
highlight = "all"
workspace-default-features = "allow"
external-default-features = "allow"
allow = []
allow-workspace = true
deny = []
skip = []
skip-tree = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []

[sources.allow-org]
github = []
gitlab = []
bitbucket = []
