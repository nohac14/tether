[workspace]
members = [
  "apps/desktop/src-tauri",
  "crates/agent-core",
  "crates/config",
  "crates/discovery",
  "crates/input-core",
  "crates/input-macos",
  "crates/input-wayland",
  "crates/input-windows",
  "crates/input-x11",
  "crates/network",
  "crates/pairing",
  "crates/protocol",
  "crates/session",
  "crates/test-support",
  "xtask",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = "deny"
pedantic = "deny"
