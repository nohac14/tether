[package]
name = "tether-input-x11"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
tether-input-core = { path = "../input-core" }

[target.'cfg(target_os = "linux")'.dependencies]
x11rb = { version = "0.14.0", default-features = false, features = ["xkb", "xtest"] }

[dev-dependencies]
tether-input-core = { path = "../input-core", features = ["backend-conformance"] }
