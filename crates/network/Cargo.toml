[package]
name = "tether-network"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
base64 = "0.22.1"
futures-util = { version = "0.3.34", default-features = false, features = ["sink"] }
http = "1.5.0"
httparse = "1.10.1"
httpdate = "1.0.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha1_smol = "1.0.1"
sha2 = { version = "0.11.1", default-features = false }
tether-config = { version = "=0.1.0", path = "../config" }
tether-pairing = { version = "=0.1.0", path = "../pairing" }
tokio = { version = "1.53.3", default-features = false, features = ["io-util", "rt", "net", "time"] }
tokio-websockets = { version = "0.13.3", default-features = false, features = ["server", "sha1_smol"] }

[target.'cfg(windows)'.dependencies]
socket2 = { version = "0.6.5", default-features = false }
windows = { version = "0.62.2", default-features = false, features = ["std", "Win32_NetworkManagement_IpHelper", "Win32_NetworkManagement_Ndis", "Win32_Networking_NetworkListManager", "Win32_Networking_WinSock", "Win32_System_Com"] }

[dev-dependencies]
tether-input-core = { version = "=0.1.0", path = "../input-core" }
tokio = { version = "1.53.3", default-features = false, features = ["test-util"] }

