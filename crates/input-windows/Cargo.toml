[package]
name = "tether-input-windows"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
tether-input-core = { version = "=0.1.0", path = "../input-core" }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", default-features = false, features = ["std", "Win32_Foundation", "Win32_System_StationsAndDesktops", "Win32_System_Threading", "Win32_UI_Input_KeyboardAndMouse"] }

[dev-dependencies]
tether-input-core = { version = "=0.1.0", path = "../input-core", features = ["backend-conformance"] }
