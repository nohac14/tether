[package]
name = "tether-config"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
getrandom = "0.4.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tether-pairing = { version = "=0.1.0", path = "../pairing" }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", default-features = false, features = ["std", "Win32_Foundation", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_SystemServices", "Win32_System_Threading"] }

[dev-dependencies]
tether-input-core = { version = "=0.1.0", path = "../input-core" }
tether-test-support = { version = "=0.1.0", path = "../test-support" }
