[package]
name = "tether-input-macos"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
tether-input-core = { version = "=0.1.0", path = "../input-core" }

[target.'cfg(target_os = "macos")'.dependencies]
objc2-core-graphics = { version = "0.3.2", default-features = false, features = ["std", "CGEvent", "CGEventSource", "CGEventTypes", "CGGeometry", "CGRemoteOperation"] }

[dev-dependencies]
tether-input-core = { version = "=0.1.0", path = "../input-core", features = ["backend-conformance"] }
