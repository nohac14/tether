[package]
name = "tether-desktop"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false

[lints]
workspace = true

[features]
windows-test = ["dep:tauri", "dep:tauri-build", "dep:winreg", "dep:tauri-plugin-single-instance", "dep:tether-agent-core", "dep:qrcode", "dep:serde", "dep:windows"]

[dependencies]
tether-network = { version = "=0.1.0", path = "../../../crates/network" }

[dev-dependencies]
http = "1.5.0"

[target.'cfg(windows)'.dependencies]
qrcode = { version = "0.14.1", default-features = false, optional = true }
serde = { version = "1.0", features = ["derive"], optional = true }
tauri = { version = "2.12.7", default-features = false, features = ["wry", "custom-protocol", "tray-icon"], optional = true }
winreg = { version = "0.56.0", optional = true }
tauri-plugin-single-instance = { version = "2.5.5", default-features = false, optional = true }
tether-agent-core = { version = "=0.1.0", path = "../../../crates/agent-core", features = ["windows-test"], optional = true }
windows = { version = "0.62.2", default-features = false, features = ["std", "Win32_Foundation", "Win32_System_RemoteDesktop", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"], optional = true }

[target.'cfg(windows)'.build-dependencies]
tauri-build = { version = "2.7.6", default-features = false, features = ["config-json"], optional = true }
